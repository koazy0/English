server {
    listen 80;
    server_name koazy.site www.koazy.site;
    return 301 https://$server_name$request_uri;
}

# HTTPS - 主服务
server {
    listen 443 ssl default_server;
    server_name koazy.site www.koazy.site;

    ssl_certificate /opt/cert/koazy.site.pem;
    ssl_certificate_key /opt/cert/koazy.site.key;

    # 把 root 提到 server 级别
    root /opt/index;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # 主页面 - 精确匹配根路径
    location = / {
        # root 已在 server 级别设置
    }

    # 舒尔特方格 - 使用 location /schulte/ 确保匹配子路径

    location = /schulte {
        return 301 /schulte/;
    }
    location /schulte/ {
        alias /opt/schulte/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 英语二每日阅读 - 代理到Flask后端
    location = /en {
        return 301 /en/;
    }
    location /en/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /moyu {
        return 301 /moyu/;
    }
    # 计算器 - 同样处理
    location /moyu/ {
        alias /opt/calculate/;
        index index.html;
        try_files $uri $uri/ =404;
    }


    location = /api {
        return 301 /api/;
    }
    # 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    # location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}
